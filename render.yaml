services:
  - type: web
    name: brandguard
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: DEMO_MODE
        value: "true"
      - key: OCR_BACKEND
        value: tesseract
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma
      - key: IMAGE_REVIEW_ENABLED
        value: "true"
