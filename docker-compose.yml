services:
  postgres:
    image: postgres:16-alpine
    container_name: brandguard-postgres
    restart: always
    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: brandguard
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brandguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://brandguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/brandguard
      LLM_PROVIDER: mock
      LLM_MODEL: claude-sonnet-4-20250514
      DEMO_MODE: "true"
      CHROMA_PERSIST_DIR: /tmp/chroma
      PORT: ${PORT:-8000}
    ports:
      - "${HOST_PORT:-8000}:${PORT:-8000}"

volumes:
  pgdata:
